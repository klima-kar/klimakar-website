name: Production build

# Builds the production sites (dist/, dist-webasto/, dist-eberspaecher/, no PUBLIC_NOINDEX) for every commit on main and
# keeps them as the artifact `site-build` with a sha256 manifest. infra `deploy` uploads exactly these files to OVH on
# the owner's command, so no site code runs outside CI. Deploys nothing itself.
# Public repo: runs on GitHub-hosted runners only, never self-hosted.
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/production-build.yml]

permissions:
  contents: read

# every commit on main keeps its own build: runs are never cancelled
concurrency:
  group: production-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build main site and brand sites
        run: npm run build:all
      - name: Write the sha256 manifest
        run: |
          set -euo pipefail
          dirs=(dist dist-webasto dist-eberspaecher)
          for dir in "${dirs[@]}"; do test -d "$dir"; done
          odd=$(find "${dirs[@]}" ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then echo "::error::not a regular file or directory in the build: $odd"; exit 1; fi
          find "${dirs[@]}" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > build-manifest.sha256
          echo "files in the build: $(wc -l < build-manifest.sha256)"
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: |
            dist
            dist-webasto
            dist-eberspaecher
            build-manifest.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
